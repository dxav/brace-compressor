[build-system]
requires = ["setuptools>=68", "wheel", "maturin>=1.5"]
build-backend = "maturin"

[project]
name = "hoaps-compressor"
version = "0.1.0"
description = "Error-bounded reconstructed-neighbor numcodecs codec for HOAPS wvpa climate data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HOAPS Compressor Team" }]
keywords = ["numcodecs", "codec", "compression", "climate", "HOAPS"]
dependencies = [
    "numpy>=1.26",
    "numcodecs>=0.12",
    "zstandard>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.0"]

[tool.maturin]
manifest-path = "rust/hoaps_scan/Cargo.toml"
python-source = "src"
module-name = "hoaps_scan"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
