[build-system]
requires = ["setuptools>=68", "wheel", "maturin>=1.5"]
build-backend = "maturin"

[project]
name = "brace-compressor"
version = "0.1.0"
description = "Error-bounded reconstructed-neighbor numcodecs codec for gridded climate data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EObytes" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
keywords = ["BRACE", "numcodecs", "codec", "compression", "climate"]
dependencies = [
    "numpy>=1.26",
    "numcodecs>=0.12",
    "zstandard>=0.22",
]

[project.urls]
Repository = "https://github.com/eobytes/brace-compressor"
Issues = "https://github.com/eobytes/brace-compressor/issues"

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.0"]
analysis = ["xarray>=2024.1", "h5netcdf>=1.3"]

[tool.maturin]
manifest-path = "rust/brace_scan/Cargo.toml"
python-source = "src"
module-name = "brace_scan._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
